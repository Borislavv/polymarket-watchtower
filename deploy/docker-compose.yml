services:
  postgres:
    image: postgres:16-alpine
    container_name: watchtower-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower
      POSTGRES_DB: watchtower
    volumes:
      - pg-data:/var/lib/postgresql/data
    # Local-only port published on 5433 to avoid colliding with a host
    # Postgres that may already own 5432. Inside the obs network the
    # service is still on 5432; that's the port the watchtower POSTGRES_DSN
    # below refers to.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchtower -d watchtower"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [obs]

  watchtower:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: watchtower
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ENV: prod
      LOG_LEVEL: info
      METRICS_PORT: "9090"
      # The compose-internal DSN. Override in .env when running outside compose.
      POSTGRES_DSN: postgres://watchtower:watchtower@postgres:5432/watchtower?sslmode=disable
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [obs]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: watchtower-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9091:9090"
    depends_on: [watchtower]
    networks: [obs]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: watchtower-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [obs]

volumes:
  prom-data: {}
  grafana-data: {}
  pg-data: {}

networks:
  obs: {}
